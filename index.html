<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320, height=320, initial-scale=1.0">
<title>NZXT Kraken Dashboard</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 320px;
        height: 320px;
        overflow: hidden;
        background: #000;
    }

    body {
        font-family:
            "Segoe UI",
            Arial,
            Helvetica,
            sans-serif;

        color: #f4f7ff;
        background:
            radial-gradient(
                circle at 50% 45%,
                rgba(20, 20, 30, 0.45),
                #000 65%
            );
    }

    #screen {
        position: relative;
        width: 320px;
        height: 320px;
        overflow: hidden;
        border-radius: 50%;
    }

    /* ----------------------------------------
       Animated circular border
       ---------------------------------------- */

    .ring {
        position: absolute;
        inset: 0;
        width: 320px;
        height: 320px;
    }

    .ring-track {
        fill: none;
        stroke: rgba(25, 35, 70, 0.22);
        stroke-width: 9;
    }

    .ring-glow {
        fill: none;
        stroke: url(#gradient);
        stroke-width: 9;
        stroke-linecap: round;

        /* Reference-style open arc with a centered gap at the bottom. */
        stroke-dasharray: 760 157;
        stroke-dashoffset: -78.5;
        transform: rotate(90deg);
        transform-origin: 160px 160px;

        filter:
            drop-shadow(0 0 3px rgba(0, 155, 255, .72))
            drop-shadow(0 0 8px rgba(115, 55, 255, .46));
    }

    /* ----------------------------------------
       Subtle interior glow
       ---------------------------------------- */

    .innerGlow {
        position: absolute;
        width: 230px;
        height: 230px;
        left: 45px;
        top: 45px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(20, 50, 100, 0.08),
                transparent 68%
            );

        pointer-events: none;
    }

    /* ----------------------------------------
       NZXT logo
       ---------------------------------------- */

    .brand {
        position: absolute;
        top: 35px;
        left: 0;
        width: 100%;

        text-align: center;

        font-size: 27px;
        font-weight: 800;
        letter-spacing: 1px;

        color: #e9edfa;
    }

    /* ----------------------------------------
       Main layout
       ---------------------------------------- */

    .metrics {
        position: absolute;
        left: 0;
        top: 94px;

        width: 320px;
        height: 158px;
        padding: 0 25px;

        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 16px;
    }

    .metric {
        position: relative;

        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .label {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: .3px;

        color: #e8ebf4;
        margin-bottom: 2px;
    }

    .temperature {
        font-size: 60px;
        line-height: 60px;

        font-weight: 800;
        letter-spacing: -3px;

        color: #edf1fa;

        text-shadow:
            0 0 5px rgba(255,255,255,.08);
    }

    .degree {
        font-size: 27px;
        vertical-align: top;

        margin-left: 2px;
        letter-spacing: 0;
    }

    .usage {
        margin-top: 5px;

        font-size: 28px;
        line-height: 29px;

        font-weight: 600;
        letter-spacing: -1px;

        color: #e9edf8;
    }

    /* ----------------------------------------
       Center divider
       ---------------------------------------- */

    .divider {
        position: absolute;

        width: 2px;
        height: 126px;

        left: 159px;
        top: 100px;

        background: rgba(240,245,255,.95);

        transform: none;
        transform-origin: center;

        box-shadow: 0 0 5px rgba(255,255,255,.16);
    }

    /* ----------------------------------------
       Power
       ---------------------------------------- */

    .power {
        position: absolute;

        left: 0;
        bottom: 39px;

        width: 100%;

        text-align: center;
    }

    .power-label {
        font-size: 17px;
        font-weight: 700;

        color: #e5e9f4;

        margin-bottom: 1px;
    }

    .power-value {
        font-size: 27px;
        line-height: 29px;

        font-weight: 700;

        color: #e5e9f4;
    }

    /* ----------------------------------------
       Power draw ring indicator
       ---------------------------------------- */

    .power-dot {
        position: absolute;
        width: 16px;
        height: 16px;
        left: 152px;
        top: 6px;

        border-radius: 50%;
        background: #fff;

        box-shadow:
            0 0 4px rgba(255,255,255,.95),
            0 0 10px rgba(255,255,255,.65),
            0 0 18px rgba(180,225,255,.38);

        z-index: 5;
        pointer-events: none;

        transform-origin: 8px 154px;
        transform: rotate(-120deg);

        transition: transform .55s ease-out;
    }

    /* ----------------------------------------
       Loading / disconnected indicator
       ---------------------------------------- */

    .status {
        position: absolute;

        left: 0;
        bottom: 18px;

        width: 100%;

        text-align: center;

        font-size: 6px;
        letter-spacing: 1px;

        color: rgba(180,190,215,.35);

        text-transform: uppercase;
    }

    /* ----------------------------------------
       Temperature colors
       ---------------------------------------- */

    .warm {
        color: #ffd66b;
    }

    .hot {
        color: #ff756d;
    }

    /* ----------------------------------------
       Browser preview controls
       ---------------------------------------- */

    #previewNotice {
        display: none;
    }

    /*
       CAM provides the real dimensions. This page is intentionally
       locked to the Z-series 320x320 display.
    */
</style>

    </div>

                GPU
            </div>

            <div id="gpuTemp" class="temperature" style="font-size: 55px; translate: -6.80003px 3.19997px;">34<span class="degree" style="translate: 0px -14px; font-size: 25.8683px; line-height: 57.485px; width: 10px; height: 40px; overflow: visible;">°</span></div>

<div data-kz-shape="box" data-kz-added="1" data-kz-added-name="NZXT Box" style="position: absolute; left: 110px; top: 110px; z-index: 31; font-family: &quot;Segoe UI&quot;, Arial, sans-serif; font-size: 5.616px; font-weight: 800; color: rgb(238, 242, 255); white-space: nowrap; width: 120px; height: 40px; background: transparent; border: 3px solid rgb(238, 242, 255); overflow: visible; translate: -9px -50px;"></div></div>


<script>

/*
============================================================
 NZXT KRAKEN WEB INTEGRATION
============================================================

 CAM calls:

 window.nzxt.v1.onMonitoringDataUpdate(data)

 approximately once per second.

 We intentionally don't hard-code a single exact monitoring
 object layout here. The helper functions below tolerate
 small differences between CAM versions.
============================================================
*/


// ---------------------------------------------------------
// DOM
// ---------------------------------------------------------

const cpuTempElement = document.getElementById("cpuTemp");
const cpuLoadElement = document.getElementById("cpuLoad");

const gpuTempElement = document.getElementById("gpuTemp");
const gpuLoadElement = document.getElementById("gpuLoad");

const powerElement = document.getElementById("power");
const powerDotElement = document.getElementById("powerDot");
const statusElement = document.getElementById("status");


// ---------------------------------------------------------
// Helpers
// ---------------------------------------------------------

function number(value) {

    if (typeof value === "number" && Number.isFinite(value)) {
        return value;
    }

    if (typeof value === "string") {

        const parsed = parseFloat(value);

        if (Number.isFinite(parsed)) {
            return parsed;
        }
    }

    return null;
}


/*
 Find a metric inside an object using several possible names.
*/

function findMetric(object, names) {

    if (!object || typeof object !== "object") {
        return null;
    }

    for (const name of names) {

        if (Object.prototype.hasOwnProperty.call(object, name)) {

            const value = number(object[name]);

            if (value !== null) {
                return value;
            }
        }
    }

    return null;
}


/*
 Recursively search an object for a numeric property.

 Used mainly for power because CAM versions/devices can expose
 power information in slightly different places.
*/

function recursiveMetric(object, names, depth = 0) {

    if (!object || typeof object !== "object") {
        return null;
    }

    if (depth > 5) {
        return null;
    }

    const direct = findMetric(object, names);

    if (direct !== null) {
        return direct;
    }

    for (const key of Object.keys(object)) {

        const value = object[key];

        if (value && typeof value === "object") {

            const result =
                recursiveMetric(value, names, depth + 1);

            if (result !== null) {
                return result;
            }
        }
    }

    return null;
}


/*
 Find the first useful component in an array.
*/

function firstComponent(value) {

    if (Array.isArray(value) && value.length) {
        return value[0];
    }

    if (value && typeof value === "object") {
        return value;
    }

    return {};
}


/*
 Clamp a number.
*/

function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
}


// ---------------------------------------------------------
// Display helpers
// ---------------------------------------------------------

function setTemperature(element, value) {

    if (value === null) {

        element.innerHTML =
            '--<span class="degree">°</span>';

        return;
    }

    const temp = Math.round(value);

    element.innerHTML =
        `${temp}<span class="degree">°</span>`;

}


function setPercent(element, value) {

    if (value === null) {
        element.textContent = "--%";
        return;
    }

    /*
     CAM can expose utilization in either of these formats:

       7      = 7%
       0.07   = 7%

     Normalize fractional 0..1 values before displaying them.
    */
    let percent = value;

    if (percent >= 0 && percent <= 1) {
        percent *= 100;
    }

    element.textContent =
        `${Math.round(clamp(percent, 0, 100))}%`;
}


function setPower(value) {

    if (value === null) {
        powerElement.textContent = "--W";
        powerDotElement.style.transform = "rotate(-120deg)";
        return;
    }

    powerElement.textContent =
        `${Math.round(value)}W`;

    // Move the white glow around the outer ring as power draw rises.
    // 0W starts upper-left; 1600W reaches upper-right across a 240° sweep.
    const normalizedPower = clamp(value, 0, 1600) / 1600;
    const angle = -120 + (normalizedPower * 240);

    powerDotElement.style.transform =
        `rotate(${angle}deg)`;
}


// ---------------------------------------------------------
// Monitoring data
// ---------------------------------------------------------

function updateMonitoringData(data) {

    if (!data) {
        return;
    }


    /*
     --------------------------------------------------------
     CPU
     --------------------------------------------------------
    */

    const cpu = firstComponent(data.cpus);

    const cpuTemperature =
        findMetric(cpu, [
            "temperature",
            "temp",
            "temperatureC",
            "temperatureCelsius"
        ]);

    const cpuLoad =
        findMetric(cpu, [
            "load",
            "usage",
            "utilization",
            "loadPercentage",
            "usagePercentage"
        ]);


    /*
     --------------------------------------------------------
     GPU
     --------------------------------------------------------
    */

    const gpu = firstComponent(data.gpus);

    const gpuTemperature =
        findMetric(gpu, [
            "temperature",
            "temp",
            "temperatureC",
            "temperatureCelsius"
        ]);

    const gpuLoad =
        findMetric(gpu, [
            "load",
            "usage",
            "utilization",
            "loadPercentage",
            "usagePercentage"
        ]);


    /*
     --------------------------------------------------------
     Update display
     --------------------------------------------------------
    */

    setTemperature(
        cpuTempElement,
        cpuTemperature
    );

    setPercent(
        cpuLoadElement,
        cpuLoad
    );


    setTemperature(
        gpuTempElement,
        gpuTemperature
    );

    setPercent(
        gpuLoadElement,
        gpuLoad
    );


    /*
     --------------------------------------------------------
     Power

     Prefer a system-level power value if CAM supplies one.

     Otherwise, add CPU + GPU power when both are available.
     --------------------------------------------------------
    */

    let totalPower =
        recursiveMetric(
            data,
            [
                "totalPower",
                "systemPower",
                "powerUsage",
                "powerDraw",
                "packagePower"
            ]
        );


    if (totalPower === null) {

        const cpuPower =
            recursiveMetric(
                cpu,
                [
                    "power",
                    "powerUsage",
                    "powerDraw",
                    "packagePower",
                    "watts"
                ]
            );

        const gpuPower =
            recursiveMetric(
                gpu,
                [
                    "power",
                    "powerUsage",
                    "powerDraw",
                    "watts"
                ]
            );


        if (
            cpuPower !== null &&
            gpuPower !== null
        ) {

            totalPower =
                cpuPower + gpuPower;

        }
        else if (gpuPower !== null) {

            totalPower = gpuPower;

        }
        else if (cpuPower !== null) {

            totalPower = cpuPower;
        }
    }


    setPower(totalPower);


    statusElement.textContent =
        "CAM CONNECTED";
}


// ---------------------------------------------------------
// NZXT CAM API
// ---------------------------------------------------------

/*
 Preserve anything CAM may already have placed on window.nzxt.
*/

window.nzxt = window.nzxt || {};

window.nzxt.v1 = window.nzxt.v1 || {};


/*
 CAM detects this callback and begins sending monitoring data.
*/

window.nzxt.v1.onMonitoringDataUpdate =
    function(data) {

        updateMonitoringData(data);

        /*
         Uncomment this temporarily if you want to inspect
         the exact CAM data your PC provides:

         console.log("NZXT CAM DATA:", data);
        */
    };


// ---------------------------------------------------------
// Browser preview
// ---------------------------------------------------------

/*
 When opened directly in Chrome/Edge, CAM isn't present.

 We therefore show simulated values so the design can be
 developed without the Kraken connected.
*/

const isKraken =
    new URLSearchParams(window.location.search)
        .get("kraken") === "1";


if (!isKraken) {

    let demo = {
        cpuTemp: 59,
        cpuLoad: 7,

        gpuTemp: 34,
        gpuLoad: 10,

        power: 161
    };


    setTemperature(
        cpuTempElement,
        demo.cpuTemp
    );

    setPercent(
        cpuLoadElement,
        demo.cpuLoad
    );

    setTemperature(
        gpuTempElement,
        demo.gpuTemp
    );

    setPercent(
        gpuLoadElement,
        demo.gpuLoad
    );

    setPower(demo.power);

    statusElement.textContent =
        "BROWSER PREVIEW";
}

</script>

      gpus:[{name:'GeForce RTX',load:.41,temperature:47,minTemperature:31,maxTemperature:72,frequency:2715,minFrequency:210,maxFrequency:2820,stockFrequency:2505,fanSpeed:980,minFanSpeed:0,maxFanSpeed:3000,power:161}],
      ram:{totalSize:65536,inUse:23800,modules:[{kind:'DDR5',size:32768,model:'Demo DDR5 Module',frequency:6000,stockFrequency:4800}]},
