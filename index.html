<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320, height=320, initial-scale=1.0">
<title>NZXT Kraken Dashboard</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 320px;
        height: 320px;
        overflow: hidden;
        background: #000;
    }

    body {
        font-family:
            "Segoe UI",
            Arial,
            Helvetica,
            sans-serif;

        color: #f4f7ff;
        background:
            radial-gradient(
                circle at 50% 45%,
                rgba(20, 20, 30, 0.45),
                #000 65%
            );
    }

    #screen {
        position: relative;
        width: 320px;
        height: 320px;
        overflow: hidden;
        border-radius: 50%;
    }

    /* ----------------------------------------
       Animated circular border
       ---------------------------------------- */

    .ring {
        position: absolute;
        inset: 0;
        width: 320px;
        height: 320px;
    }

    .ring-track {
        fill: none;
        stroke: rgba(25, 35, 70, 0.22);
        stroke-width: 9;
    }

    .ring-glow {
        fill: none;
        stroke: url(#gradient);
        stroke-width: 9;
        stroke-linecap: round;

        /* Reference-style open arc with a centered gap at the bottom. */
        stroke-dasharray: 760 157;
        stroke-dashoffset: -78.5;
        transform: rotate(90deg);
        transform-origin: 160px 160px;

        filter:
            drop-shadow(0 0 3px rgba(0, 155, 255, .72))
            drop-shadow(0 0 8px rgba(115, 55, 255, .46));
    }

    /* ----------------------------------------
       Subtle interior glow
       ---------------------------------------- */

    .innerGlow {
        position: absolute;
        width: 230px;
        height: 230px;
        left: 45px;
        top: 45px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(20, 50, 100, 0.08),
                transparent 68%
            );

        pointer-events: none;
    }

    /* ----------------------------------------
       NZXT logo
       ---------------------------------------- */

    .brand {
        position: absolute;
        top: 35px;
        left: 0;
        width: 100%;

        text-align: center;

        font-size: 27px;
        font-weight: 800;
        letter-spacing: 1px;

        color: #e9edfa;
    }

    /* ----------------------------------------
       Main layout
       ---------------------------------------- */

    .metrics {
        position: absolute;
        left: 0;
        top: 94px;

        width: 320px;
        height: 158px;
        padding: 0 25px;

        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 16px;
    }

    .metric {
        position: relative;

        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .label {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: .3px;

        color: #e8ebf4;
        margin-bottom: 2px;
    }

    .temperature {
        font-size: 60px;
        line-height: 60px;

        font-weight: 800;
        letter-spacing: -3px;

        color: #edf1fa;

        text-shadow:
            0 0 5px rgba(255,255,255,.08);
    }

    .degree {
        font-size: 27px;
        vertical-align: top;

        margin-left: 2px;
        letter-spacing: 0;
    }

    .usage {
        margin-top: 5px;

        font-size: 28px;
        line-height: 29px;

        font-weight: 600;
        letter-spacing: -1px;

        color: #e9edf8;
    }

    /* ----------------------------------------
       Center divider
       ---------------------------------------- */

    .divider {
        position: absolute;

        width: 2px;
        height: 126px;

        left: 159px;
        top: 100px;

        background: rgba(240,245,255,.95);

        transform: none;
        transform-origin: center;

        box-shadow: 0 0 5px rgba(255,255,255,.16);
    }

    /* ----------------------------------------
       Power
       ---------------------------------------- */

    .power {
        position: absolute;

        left: 0;
        bottom: 39px;

        width: 100%;

        text-align: center;
    }

    .power-label {
        font-size: 17px;
        font-weight: 700;

        color: #e5e9f4;

        margin-bottom: 1px;
    }

    .power-value {
        font-size: 27px;
        line-height: 29px;

        font-weight: 700;

        color: #e5e9f4;
    }

    /* ----------------------------------------
       Power draw ring indicator
       ---------------------------------------- */

    .power-dot {
        position: absolute;
        width: 16px;
        height: 16px;
        left: 152px;
        top: 6px;

        border-radius: 50%;
        background: #fff;

        box-shadow:
            0 0 4px rgba(255,255,255,.95),
            0 0 10px rgba(255,255,255,.65),
            0 0 18px rgba(180,225,255,.38);

        z-index: 5;
        pointer-events: none;

        transform-origin: 8px 154px;
        transform: rotate(-120deg);

        transition: transform .55s ease-out;
    }

    /* ----------------------------------------
       Loading / disconnected indicator
       ---------------------------------------- */

    .status {
        position: absolute;

        left: 0;
        bottom: 18px;

        width: 100%;

        text-align: center;

        font-size: 6px;
        letter-spacing: 1px;

        color: rgba(180,190,215,.35);

        text-transform: uppercase;
    }

    /* ----------------------------------------
       Temperature colors
       ---------------------------------------- */

    .warm {
        color: #ffd66b;
    }

    .hot {
        color: #ff756d;
    }

    /* ----------------------------------------
       Browser preview controls
       ---------------------------------------- */

    #previewNotice {
        display: none;
    }

    /*
       CAM provides the real dimensions. This page is intentionally
       locked to the Z-series 320x320 display.
    */
</style>
