<!DOCTYPE html>
<html lang="en" data-kz-layout-version="8"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320, height=320, initial-scale=1.0">
<title>NZXT Kraken Dashboard</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 320px;
        height: 320px;
        overflow: hidden;
        background: #000;
    }

    body {
        font-family:
            "Segoe UI",
            Arial,
            Helvetica,
            sans-serif;

        color: #f4f7ff;
        background:
            radial-gradient(
                circle at 50% 45%,
                rgba(20, 20, 30, 0.45),
                #000 65%
            );
    }

    #screen {
        position: relative;
        width: 320px;
        height: 320px;
        overflow: hidden;
        border-radius: 50%;
    }

    /* ----------------------------------------
       Animated circular border
       ---------------------------------------- */

    .ring {
        position: absolute;
        inset: 0;
        width: 320px;
        height: 320px;
    }

    .ring-track {
        fill: none;
        stroke: rgba(25, 35, 70, 0.22);
        stroke-width: 9;
    }

    .ring-glow {
        fill: none;
        stroke: url(#gradient);
        stroke-width: 9;
        stroke-linecap: round;

        /* Reference-style open arc with a centered gap at the bottom. */
        stroke-dasharray: 760 157;
        stroke-dashoffset: -78.5;
        transform: rotate(90deg);
        transform-origin: 160px 160px;

        filter:
            drop-shadow(0 0 3px rgba(0, 155, 255, .72))
            drop-shadow(0 0 8px rgba(115, 55, 255, .46));
    }

    /* ----------------------------------------
       Subtle interior glow
       ---------------------------------------- */

    .innerGlow {
        position: absolute;
        width: 230px;
        height: 230px;
        left: 45px;
        top: 45px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(20, 50, 100, 0.08),
                transparent 68%
            );

        pointer-events: none;
    }

    /* ----------------------------------------
       NZXT logo
       ---------------------------------------- */

    .brand {
        position: absolute;
        top: 35px;
        left: 0;
        width: 100%;

        text-align: center;

        font-size: 27px;
        font-weight: 800;
        letter-spacing: 1px;

        color: #e9edfa;
    }

    /* ----------------------------------------
       Main layout
       ---------------------------------------- */

    .metrics {
        position: absolute;
        left: 0;
        top: 94px;

        width: 320px;
        height: 158px;
        padding: 0 25px;

        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 16px;
    }

    .metric {
        position: relative;

        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .label {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: .3px;

        color: #e8ebf4;
        margin-bottom: 2px;
    }

    .temperature {
        font-size: 60px;
        line-height: 60px;

        font-weight: 800;
        letter-spacing: -3px;

        color: #edf1fa;

        text-shadow:
            0 0 5px rgba(255,255,255,.08);
    }

    .degree {
        font-size: 27px;
        vertical-align: top;

        margin-left: 2px;
        letter-spacing: 0;
    }

    .usage {
        margin-top: 5px;

        font-size: 28px;
        line-height: 29px;

        font-weight: 600;
        letter-spacing: -1px;

        color: #e9edf8;
    }

    /* ----------------------------------------
       Center divider
       ---------------------------------------- */

    .divider {
        position: absolute;

        width: 2px;
        height: 126px;

        left: 159px;
        top: 100px;

        background: rgba(240,245,255,.95);

        transform: none;
        transform-origin: center;

        box-shadow: 0 0 5px rgba(255,255,255,.16);
    }

    /* ----------------------------------------
       Power
       ---------------------------------------- */

    .power {
        position: absolute;

        left: 0;
        bottom: 39px;

        width: 100%;

        text-align: center;
    }

    .power-label {
        font-size: 17px;
        font-weight: 700;

        color: #e5e9f4;

        margin-bottom: 1px;
    }

    .power-value {
        font-size: 27px;
        line-height: 29px;

        font-weight: 700;

        color: #e5e9f4;
    }

    /* ----------------------------------------
       Power draw ring indicator
       ---------------------------------------- */

    .power-dot {
        position: absolute;
        width: 16px;
        height: 16px;
        left: 152px;
        top: 6px;

        border-radius: 50%;
        background: #fff;

        box-shadow:
            0 0 4px rgba(255,255,255,.95),
            0 0 10px rgba(255,255,255,.65),
            0 0 18px rgba(180,225,255,.38);

        z-index: 5;
        pointer-events: none;

        transform-origin: 8px 154px;
        transform: rotate(-120deg);

        transition: transform .55s ease-out;
    }

    /* ----------------------------------------
       Loading / disconnected indicator
       ---------------------------------------- */

    .status {
        position: absolute;

        left: 0;
        bottom: 18px;

        width: 100%;

        text-align: center;

        font-size: 6px;
        letter-spacing: 1px;

        color: rgba(180,190,215,.35);

        text-transform: uppercase;
    }

    /* ----------------------------------------
       Temperature colors
       ---------------------------------------- */

    .warm {
        color: #ffd66b;
    }

    .hot {
        color: #ff756d;
    }

    /* ----------------------------------------
       Browser preview controls
       ---------------------------------------- */

    #previewNotice {
        display: none;
    }

    /*
       CAM provides the real dimensions. This page is intentionally
       locked to the Z-series 320x320 display.
    */
</style>

<script id="nzxtBindingRuntime" data-kz-runtime-version="8">(function(){
  function getPath(obj,path){
    if(path === 'derived.ramUsage') {
      const used=obj?.ram?.inUse, total=obj?.ram?.totalSize;
      return (typeof used==='number' && typeof total==='number' && total>0) ? used/total : undefined;
    }
    if(path === 'derived.cpuGpuPower') {
      const cpu=Array.isArray(obj?.cpus) ? obj.cpus[0] : obj?.cpus;
      const gpu=Array.isArray(obj?.gpus) ? obj.gpus[0] : obj?.gpus;

      const readPower=(component)=>{
        if(!component || typeof component!=='object') return null;
        for(const key of ['power','powerUsage','powerDraw','packagePower','watts']){
          const n=Number(component[key]);
          if(Number.isFinite(n)) return n;
        }
        return null;
      };

      const cpuPower=readPower(cpu);
      const gpuPower=readPower(gpu);

      if(cpuPower!==null && gpuPower!==null) return cpuPower+gpuPower;
      if(cpuPower!==null) return cpuPower;
      if(gpuPower!==null) return gpuPower;

      // Editor/sample fallback so the calculated element is visible and
      // placeable on the preview before live CAM power data is available.
      return 245;
    }
    if(path.startsWith('window.')) {
      const key=path.slice(7);
      return window.nzxt?.v1?.[key];
    }
    return path.split('.').reduce((v,k)=>v==null?undefined:v[k],obj);
  }
  function format(value,kind){
    if(value === undefined || value === null || (typeof value==='number' && !Number.isFinite(value))) return '--';
    if(kind==='text') return String(value);
    if(kind==='percent') { let n=Number(value); if(n>=0 && n<=1)n*=100; return Math.round(n)+'%'; }
    if(kind==='temperature') return Math.round(Number(value))+'°C';
    if(kind==='mhz') return Math.round(Number(value))+' MHz';
    if(kind==='rpm') return Math.round(Number(value))+' RPM';
    if(kind==='watts') return Math.round(Number(value))+' W';
    if(kind==='mib') return Math.round(Number(value))+' MiB';
    if(kind==='integer') return String(Math.round(Number(value)));
    return String(value);
  }
  function numeric(value){
    const n=Number(value);
    return Number.isFinite(n) ? n : null;
  }
  function componentPower(component){
    if(!component || typeof component!=='object') return null;
    for(const key of ['power','powerUsage','powerDraw','packagePower','watts']){
      const n=numeric(component[key]);
      if(n!==null) return n;
    }
    return null;
  }
  function totalPower(data){
    if(!data || typeof data!=='object') return null;
    for(const key of ['totalPower','systemPower','powerUsage','powerDraw','packagePower']){
      const n=numeric(data[key]);
      if(n!==null) return n;
    }
    const cpu=Array.isArray(data.cpus) ? data.cpus[0] : data.cpus;
    const gpu=Array.isArray(data.gpus) ? data.gpus[0] : data.gpus;
    const cp=componentPower(cpu), gp=componentPower(gpu);
    if(cp!==null && gp!==null) return cp+gp;
    return gp!==null ? gp : cp;
  }
  function ringSensorValue(data,path){
    path=path||'derived.cpuGpuPower';
    let value=path==='derived.cpuGpuPower' ? totalPower(data) : numeric(getPath(data,path));
    if(value===null || value===undefined) return null;
    if((path==='derived.ramUsage' || /\.load$/.test(path)) && value>=0 && value<=1) value*=100;
    return numeric(value);
  }
  function updatePowerRings(data){
    document.querySelectorAll('[data-kz-power-ring="1"]').forEach(ring=>{
      const track=ring.querySelector('[data-kz-power-dot-track]');
      if(!track) return;
      const sensor=ring.dataset.kzRingSensor||'derived.cpuGpuPower';
      const sensorValue=ringSensorValue(data,sensor);
      const min=Math.max(0, Number(ring.dataset.kzPowerMin)||0);
      const max=Math.max(min+1, Number(ring.dataset.kzPowerMax)||1600);
      // CAM can occasionally deliver a partial monitoring packet. Keep the
      // previous dot position instead of visibly snapping to minimum for one tick.
      if(sensorValue===null) return;
      const value=Math.max(min,Math.min(max,sensorValue));
      const angle=-120+(((value-min)/(max-min))*240);
      const rounded=Math.round(angle*100)/100;
      // Always resolve the dot's absolute point on the fixed r=146 orbit.
      // This keeps its centre locked to the ring when unrelated appearance
      // controls (such as ring width/glow) redraw the SVG or when dot size changes.
      track.dataset.kzLastPowerAngle=String(rounded);
      // Do not rotate the 320x320 track: that forces CAM to recompose the
      // whole display underneath the text. Move only the tiny dot instead.
      const dot=track.querySelector('[data-kz-power-dot]');
      if(!dot) return;
      const size=Math.max(2, Number(dot.dataset.kzDotSize)||parseFloat(dot.style.width)||16);
      const radius=146;
      const rad=rounded*Math.PI/180;
      const x=160 + radius*Math.sin(rad) - size/2;
      const y=160 - radius*Math.cos(rad) - size/2;
      track.style.transform='none';
      track.style.transition='none';
      dot.style.left=x.toFixed(2)+'px';
      dot.style.top=y.toFixed(2)+'px';
    });
  }
  function apply(data){
    document.querySelectorAll('[data-nzxt-binding]').forEach(el=>{
      const path=el.getAttribute('data-nzxt-binding');
      const kind=el.getAttribute('data-nzxt-format')||'text';

      const formatted=format(value,kind);

      // do not replace it with a one-frame '--' placeholder. The next valid
      // packet updates normally, eliminating intermittent stat flashes.
      if(formatted==='--' && el.dataset.kzLastDisplay && el.dataset.kzLastDisplay!=='--') return;
      if(kind==='temperature'){
        if(el.dataset.kzLastDisplay!==formatted){
          el.dataset.kzLastDisplay=formatted;
          if(formatted==='--'){
            el.textContent=formatted;
          } else {
            const match=formatted.match(/^(-?\d+)°C$/);

      kraken:{liquidTemperature:32}
    };
    window.nzxt.v1.width=window.nzxt.v1.width||320;
    window.nzxt.v1.height=window.nzxt.v1.height||320;
    window.nzxt.v1.shape=window.nzxt.v1.shape||'circle';
    window.nzxt.v1.targetFps=window.nzxt.v1.targetFps||30;
    apply(demo);
    window.__nzxtEditorDemoData=demo;
  }
})();</script></body></html>
